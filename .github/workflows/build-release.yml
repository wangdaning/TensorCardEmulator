name: Build and Release TensorCardEmulator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew
        
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Stage Module Components
        run: |
          mkdir -p MagiskModule/common
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" MagiskModule/common/TensorCardEmulator.apk
            echo "Staged APK successfully."
          else
            echo "Error: Compiled APK could not be found!" && exit 1
          fi

      - name: Package Flashable Module ZIP
        run: |
          cd MagiskModule
          zip -r "../TensorCardEmulatorv1.0.1.zip" ./*
          cd ..
          echo "Module compilation bundle prepared"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: TensorCardEmulatorv1.0.1
          path: MagiskModule/
          if-no-files-found: error

      - name: Create GitHub Release Artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: TensorCardEmulatorv1.0.1.zip
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
