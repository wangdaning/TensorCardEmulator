name: Build and Release TensorCardEmulator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant execute permission to Gradlew
        run: chmod +x gradlew

      - name: Compile App APK
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | grep -v Signed | head -n 1)
          if [ -f "$UNSIGNED_APK" ]; then
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -1)
            $APKSIGNER sign \
              --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out app/build/outputs/apk/release/TensorCardEmulator-Signed.apk \
              "$UNSIGNED_APK"
            echo "APK signed successfully."
          else
            echo "Error: Unsigned APK could not be found!" && exit 1
          fi

      - name: Stage module components
        run: |
          mkdir -p MagiskModule/common
          SIGNED_APK="app/build/outputs/apk/release/TensorCardEmulator-Signed.apk"
          if [ -f "$SIGNED_APK" ]; then
            cp "$SIGNED_APK" MagiskModule/common/TensorCardEmulator.apk
            echo "Staged signed APK successfully."
          else
            echo "Error: Signed APK not found!" && exit 1
          fi

      - name: Package flashable module ZIP
        run: |
          cd MagiskModule
          zip -r "../TensorCardEmulatorv1.0.1.zip" ./*
          cd ..

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: TensorCardEmulatorv1.0.1
          path: MagiskModule/
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: TensorCardEmulatorv1.0.1.zip
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}