name: Build and Release TensorCardEmulator

on:
  push:
    tags:
      - 'v*' # Triggers the release logic automatically when pushing a version tag (e.g., v1.0.0)
  workflow_dispatch: # Allows manual pipeline triggering from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Check out the project codebase using v6 (Node 24 Compatible)
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Set up Java Environment using v5 (Node 24 Compatible)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      # 3. Make the Gradle execution wrapper runnable
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # 4. Compile the Release APK container
      - name: Compile App APK
        run: ./gradlew assembleRelease

      # 5. Locate and position the fresh APK into your Module Staging Area
      - name: Stage Module Components
        run: |
          mkdir -p MagiskModule/common
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" MagiskModule/common/TensorCardEmulator.apk
            echo "Staged APK successfully."
          else
            echo "Error: Compiled APK could not be found!" && exit 1
          fi

      # 6. Compress the staging directory into the specifically named flashable module archive
      - name: Package Flashable Module ZIP
        run: |
          cd MagiskModule
          zip -r ../TensorCardEmulator1.0.1.zip ./*
          cd ..
          echo "Module compilation bundle prepared."

      # 7. Upload the compiled artifacts as an Actions run attachment
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TensorCardEmulator1.0.1
          path: TensorCardEmulator1.0.1.zip

      # 8. Create GitHub Release and attach the specifically named ZIP if a version tag triggered the run
      - name: Create GitHub Release Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TensorCardEmulator1.0.1.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
