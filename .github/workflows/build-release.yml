name: Build and Release TensorCardEmulator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant execute permission to Gradlew
        run: chmod +x gradlew

      - name: Decode and setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      - name: Compile App APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Clean up keystore
        run: rm -f app/keystore.jks

      - name: Stage module components
        run: |
          mkdir -p MagiskModule/common
          SIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$SIGNED_APK" ]; then
            cp "$SIGNED_APK" MagiskModule/common/TensorCardEmulator.apk
            echo "Staged signed APK successfully."
          else
            echo "Error: Signed APK not found!" && exit 1
          fi

      - name: Package flashable module ZIP
        run: |
          cd MagiskModule
          zip -r "../TensorCardEmulatorv1.0.1.zip" ./*
          cd ..
          ls -lah *.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: TensorCardEmulatorv1.0.1
          path: MagiskModule/
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TensorCardEmulatorv1.0.1.zip
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}